[project]
name = "ragsys"
version = "0.1.0"
description = "Production-grade hybrid RAG over regulatory PDFs (SEBI circulars)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=1.11,<2",
    "fastapi>=0.142,<1",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=3.5,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6.0",
    "qdrant-client>=1.19,<2",
    "fastembed>=0.8,<0.9",
    "pymupdf>=1.28,<2",
    "redis>=5.0",
    "structlog>=24.1",
    "typer>=0.12",
    "langfuse>=4.16,<5",
    "snowballstemmer>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Docling pulls in torch + layout models: needed only for ingestion, not for serving.
ingest = ["docling>=2.132,<3"]
# RAGAS is only needed by the evaluation harness.
eval = ["ragas>=0.4.3,<0.5", "langchain-anthropic>=0.3", "langchain-community>=0.4,<0.4.2"]

[project.scripts]
ragsys = "ragsys.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "reportlab>=4.2",
    "fakeredis>=2.24",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs local services or model downloads",
    "slow: slow tests (model downloads, docling)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/ragsys/devtools/sample_corpus.py" = ["E501"]  # literal sample data
# tests favour compact, readable assertions over lint purity
"tests/**" = ["PT018", "PT011", "E501", "E731", "RUF012", "SIM117"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ragsys"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# PyMuPDF ships without type annotations
module = ["ragsys.ingestion.parsers.pymupdf_parser", "ragsys.ingestion.parsers.docling_parser"]
disallow_untyped_calls = false
